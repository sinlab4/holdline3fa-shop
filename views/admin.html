<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <a class="brand" href="/">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="7" fill="var(--accent)"/><path d="M9 21.5v-11M9 16h7a4 4 0 0 1 4 4v1.5" fill="none" stroke="var(--accent-ink)" stroke-width="2.6" stroke-linecap="round"/><circle cx="22.5" cy="11" r="2.2" fill="var(--accent-ink)"/></svg>
      Admin
    </a>
    <div class="who"><a class="btn" href="/">View shop</a><button class="btn" id="logout" type="button">Log out</button></div>
  </header>
  <div class="notice warn" id="provNote" hidden></div>
  <div class="tabs" id="tabs" role="tablist" aria-label="Admin sections">
    <button class="tab" type="button" role="tab" data-tab="overview" aria-selected="true">Overview</button>
    <button class="tab" type="button" role="tab" data-tab="orders" aria-selected="false">Orders</button>
    <button class="tab" type="button" role="tab" data-tab="catalog" aria-selected="false">Catalog</button>
    <button class="tab" type="button" role="tab" data-tab="settings" aria-selected="false">Settings</button>
    <button class="tab" type="button" role="tab" data-tab="customers" aria-selected="false">Customers</button>
  </div>
  <div class="col" id="body"></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/common.js"></script>
<script src="/admin.js"></script>
</body>
</html>
